name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test Go code (Alpine)
    # GitHub has no hosted Alpine runner. This executes all Go commands inside
    # the official Alpine-based Go image; runs-on only selects its host runner.
    runs-on: ubuntu-24.04
    container: golang:1.24-alpine
    steps:
      - uses: actions/checkout@v4
      - run: go vet ./...
      - run: go test ./...

  docker:
    name: Build container images
    # ubuntu-slim does not support Docker-in-Docker. Pin the full runner here
    # because this job validates the production Dockerfile targets.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: false
          tags: pricepulse-api:ci
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: false
          tags: pricepulse-worker:ci
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: browser
          push: false
          tags: pricepulse-browser:ci
